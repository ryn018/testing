{% extends 'operations/base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center mt-5">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 720px; border-radius: 1rem;">
        <h3 class="card-title text-center mb-4 text-primary">🏡 Home Loan Eligibility Estimator</h3>
        <form method="post" class="row g-3">
            {% csrf_token %}
            <div class="col-md-6">
                <label class="form-label">Monthly Income (₹)</label>
                <input type="number" name="monthly_income" class="form-control" required placeholder="e.g., 50000">
            </div>
            <div class="col-md-6">
                <label class="form-label">Monthly Expenses (₹)</label>
                <input type="number" name="monthly_expenses" class="form-control" required placeholder="e.g., 20000">
            </div>
            <div class="col-md-6">
                <label class="form-label">Loan Tenure (Years)</label>
                <input type="number" name="tenure" class="form-control" required placeholder="e.g., 15">
            </div>
            <div class="col-md-6">
                <label class="form-label">Interest Rate (%)</label>
                <input type="number" step="0.01" name="interest_rate" class="form-control" required placeholder="e.g., 8">
            </div>
            <div class="col-12 mt-3 text-center">
                <button type="submit" class="btn btn-primary px-5">Estimate</button>
            </div>
        </form>

        {% if result %}
        <div class="alert alert-info mt-4 text-center fs-5">
            <strong>🏠 Eligible Loan Amount:</strong> ₹{{ result }}
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
