{% extends 'operations/base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center mt-5">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 720px; border-radius: 1rem;">
        <h3 class="card-title text-center mb-4 text-success">📆 EMI Calculator</h3>
        <form method="post" class="row g-3">
            {% csrf_token %}
            <div class="col-md-6">
                <label class="form-label">Principal Amount (₹)</label>
                <input type="number" name="principal" step="0.01" class="form-control" required placeholder="e.g., 500000">
            </div>
            <div class="col-md-6">
                <label class="form-label">Annual Interest Rate (%)</label>
                <input type="number" name="rate" step="0.01" class="form-control" required placeholder="e.g., 7.5">
            </div>
            <div class="col-md-6">
                <label class="form-label">Loan Tenure (Years)</label>
                <input type="number" name="tenure" class="form-control" required placeholder="e.g., 5">
            </div>
            <div class="col-12 mt-3 text-center">
                <button type="submit" class="btn btn-primary px-5">Calculate EMI</button>
            </div>
        </form>

        {% if result %}
        <div class="alert alert-info mt-4 text-center fs-5">
            <strong>💸 Your Monthly EMI:</strong> ₹{{ result }}
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
