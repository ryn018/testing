{% extends 'operations/base.html' %}
{% block content %}
<div class="d-flex justify-content-start align-items-start mt-3 ml-3">
    <div class="card shadow-sm p-4" style="max-width: 500px; width: 100%; height: 380px; border-radius: 1rem; background-color: #fff;">
        <h3 class="text-center mb-4 text-primary font-weight-bold">Loan Amount Estimator</h3>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.as_p }}
            </div>

            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-success btn-sm" style="width: 50%; border-radius: 2rem; padding: 8px 0;">
                    Predict Loan Amount
                </button>
            </div>
        </form>

        {% if prediction %}
        <div class="alert alert-info mt-4 text-center fs-5">
            <strong>Estimated Loan Amount:</strong> ₹{{ prediction|floatformat:2 }}
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
