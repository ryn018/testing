{% extends 'operations/base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center mt-5">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 720px; border-radius: 1rem;">
        <h3 class="card-title text-center mb-4 text-primary">💳 Recurring Deposit (RD) Calculator</h3>
        <form method="post" class="row g-3">
            {% csrf_token %}
            <div class="col-md-4">
                <label class="form-label">Monthly Investment (₹)</label>
                <input type="number" step="0.01" name="monthly_investment" class="form-control" required placeholder="e.g., 10000">
            </div>
            <div class="col-md-4">
                <label class="form-label">Annual Interest Rate (%)</label>
                <input type="number" step="0.01" name="rate" class="form-control" required placeholder="e.g., 6.5">
            </div>
            <div class="col-md-4">
                <label class="form-label">Tenure (Years)</label>
                <input type="number" name="years" class="form-control" required placeholder="e.g., 5">
            </div>
            <div class="col-12 mt-3 text-center">
                <button type="submit" class="btn btn-primary px-5">Calculate</button>
            </div>
        </form>

        {% if result %}
        <div class="alert alert-info mt-4 text-center fs-5">
            <strong>📈 Maturity Value:</strong> ₹{{ result }}
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
