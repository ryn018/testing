{% extends 'operations/base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center mt-5">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 720px; border-radius: 1rem;">
        <h3 class="card-title text-center mb-4 text-warning">🌅 Retirement Savings Estimator</h3>
        <form method="post" class="row g-3">
            {% csrf_token %}
            <div class="col-md-3">
                <label class="form-label">Current Savings (₹)</label>
                <input type="number" step="0.01" name="current_savings" class="form-control" required placeholder="e.g., 500000">
            </div>
            <div class="col-md-3">
                <label class="form-label">Monthly Contribution(₹)</label>
                <input type="number" step="0.01" name="monthly_contribution" class="form-control" required placeholder="e.g., 20000">
            </div>
            <div class="col-md-3">
                <label class="form-label">Annual Interest Rate (%)</label>
                <input type="number" step="0.01" name="annual_rate" class="form-control" required placeholder="e.g., 7.5">
            </div>
            <div class="col-md-3">
                <label class="form-label">Years Until Retirement</label>
                <input type="number" name="years_until_retirement" class="form-control" required placeholder="e.g., 30">
            </div>
            <div class="col-12 mt-3 text-center">
                <button type="submit" class="btn btn-success px-5">Estimate Savings</button>
            </div>
        </form>

        {% if result %}
        <div class="alert alert-info mt-4 text-center fs-5">
            <strong>Your Projected Retirement Corpus:</strong> ₹{{ result }}
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
