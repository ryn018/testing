{% extends 'operations/base.html' %}
{% block content %}
<div class="d-flex justify-content-center align-items-center mt-5">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 700px; border-radius: 1rem;">
        <h3 class="card-title text-center mb-4 text-success">📊 Simple Budget Planner</h3>
        <form method="post" class="row g-3">
            {% csrf_token %}
            <div class="col-md-6">
                <label class="form-label">Monthly Income (₹)</label>
                <input type="number" name="income" class="form-control" required placeholder="e.g., 60000">
            </div>
            <div class="col-md-6">
                <label class="form-label">Fixed Expenses (₹)</label>
                <input type="number" name="fixed_expenses" class="form-control" required placeholder="e.g., 25000">
            </div>
            <div class="col-md-6">
                <label class="form-label">Variable Expenses (₹)</label>
                <input type="number" name="variable_expenses" class="form-control" required placeholder="e.g., 10000">
            </div>
            <div class="col-12 mt-3 text-center">
                <button type="submit" class="btn btn-primary px-4">Analyze Budget</button>
            </div>
        </form>

        {% if result %}
        <div class="alert alert-info mt-4 fs-5">
            <p><strong>🧾 Total Expenses:</strong> ₹{{ result.Total_Expenses }}</p>
            <p><strong>💰 Savings:</strong> ₹{{ result.Savings }}</p>
            <p><strong>📌 Suggestion:</strong> {{ result.Suggestion }}</p>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
